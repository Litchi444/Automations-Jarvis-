# Morning briefing stack: n8n 2.x (+ffmpeg) on PostgreSQL.
# Local:   docker compose up -d --build
# Cloud:   docker compose --profile cloud up -d --build   (adds Caddy + HTTPS)

name: morning-briefing

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the assistant schema on first start (fresh volume only).
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  n8n:
    build:
      context: ./docker/n8n
      args:
        N8N_VERSION: ${N8N_VERSION:-2.48.8}
        FFMPEG_VERSION: ${FFMPEG_VERSION:-8.1}
    image: morning-briefing-n8n:${N8N_VERSION:-2.48.8}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Bound to loopback: never expose 5678 directly on a cloud VM.
    # Caddy (cloud profile) reaches it over the internal network.
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      # Database
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}

      # Core
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL}
      WEBHOOK_URL: ${WEBHOOK_URL}
      N8N_EDITOR_BASE_URL: ${WEBHOOK_URL}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-true}
      N8N_PROXY_HOPS: 1
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      TZ: ${GENERIC_TIMEZONE}

      # n8n 2.x hardening overrides — the minimum this workflow needs:
      # 1) Execute Command is excluded by default; re-enable it only
      #    (keep LocalFileTrigger blocked).
      NODES_EXCLUDE: '["n8n-nodes-base.localFileTrigger"]'
      # 2) Let expressions read TELEGRAM_* from the environment.
      #    The Telegram node has no sendVoice, so we call the Bot API
      #    via HTTP Request and the token must come from somewhere.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # File nodes are confined to ~/.n8n-files (2.x default). Explicit here.
      N8N_RESTRICT_FILE_ACCESS_TO: /home/node/.n8n-files

      # Housekeeping
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168          # hours (7 days)
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"

      # Workflow secrets
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      # School timetable (optional): ICS link for the briefing, Google calendar id for Jarvis.
      SCHOOL_ICS_URL: ${SCHOOL_ICS_URL:-}
      SCHOOL_CALENDAR_ID: ${SCHOOL_CALENDAR_ID:-}
    volumes:
      - n8n_data:/home/node/.n8n
      - n8n_files:/home/node/.n8n-files
      - ./workflows:/workflows:ro

  caddy:
    image: caddy:2-alpine
    profiles: ["cloud"]
    restart: unless-stopped
    depends_on:
      - n8n
    ports:
      - "80:80"
      - "443:443"
    environment:
      N8N_HOST: ${N8N_HOST}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  n8n_data:
  n8n_files:
  caddy_data:
  caddy_config:
